<title>luyenthuyettrinh.com</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Single white theme by choice (light in every viewer setting). Layout: Dropbox-style split hero (copy left, photo + floating product UI right) on a soft panel; app shell with sidebar */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F7FB; --soft-2:#E2EAF4; --line:#E3E8EF;
  --fg:#0B0F17; --muted:#5A6577; --blue:#0B63CE; --blue-2:#0952AD; --on-blue:#FFFFFF;
  --sky:#2EA7E6; --sky-soft:#E5F3FC; --sky-ink:#075A8C;
  --good:#1E8A4C; --good-soft:#E2F4E9; --warn:#B7791F; --bad:#C8402F; --bad-soft:#FBE6E2;
  --shadow:0 1px 2px rgba(15,30,60,.06),0 16px 40px -16px rgba(15,30,60,.22);
  --f-display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
}
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-primary:hover{background:var(--blue-2)}
.btn-sky{background:var(--blue);color:var(--on-blue)}
.btn-sky:hover{background:var(--blue-2)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--blue-2)}
.btn-text{background:none;border:none;padding:6px 4px;color:var(--fg);font-weight:600;cursor:pointer}
.btn-text:hover{color:var(--blue-2)}
.btn-lg{padding:15px 28px;font-size:16px}
.btn-sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Landing ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.l-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.l-nav .wrap{display:flex;align-items:center;gap:16px;height:76px;position:relative}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:18px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;flex:none}
.logo-mark i{display:block;width:3px;border-radius:2px;background:var(--on-blue);margin:0 1px}
.logo-mark span{display:flex;align-items:center;height:16px}
.l-nav .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav-link{background:none;border:none;font-size:16px;font-weight:500;padding:9px 14px;cursor:pointer;color:var(--fg);border-radius:10px}
.nav-link:hover{background:var(--soft)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;border-radius:10px;cursor:pointer;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--soft)}
.l-nav .btn-primary{margin:0 6px}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:70px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;min-width:230px;z-index:25}
.menu button{text-align:left;background:none;border:none;padding:11px 14px;border-radius:10px;font-weight:500;cursor:pointer}
.menu button:hover{background:var(--soft)}
.l-hero{background:var(--soft)}
.l-hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding-block:64px 72px}
.l-hero h1{font-size:clamp(36px,4.3vw,58px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.l-hero .lead2{font-size:clamp(17px,1.6vw,21px);color:var(--muted);margin-top:24px;max-width:42ch;line-height:1.55}
.l-hero .ctas{display:flex;gap:18px;flex-wrap:wrap;margin-top:40px;align-items:center}
.collage{position:relative;min-width:0;height:clamp(360px,36vw,480px)}
.collage img{position:absolute;display:block;max-width:100%;object-fit:cover;background:var(--soft-2)}
.ph-main{right:0;top:0;width:72%;height:80%;border-radius:22px}
.ph-side{left:0;top:9%;width:36%;height:38%;border-radius:18px;border:6px solid var(--soft);box-shadow:var(--shadow)}
.ph-low{left:9%;bottom:0;width:44%;height:42%;border-radius:18px;border:6px solid var(--soft);box-shadow:var(--shadow)}
.float{position:absolute;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.float.coach{display:none}
.float.score{right:-14px;bottom:6%;width:200px}
.float .wave{height:34px}
.hv-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;min-width:0}
.hv-score{display:flex;align-items:center;gap:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sky-soft);display:grid;place-items:center;font-weight:700;color:var(--sky-ink);flex:none}
.wave{display:flex;align-items:center;gap:3px;height:64px}
.wave i{flex:1;background:var(--blue);border-radius:3px;opacity:.85;animation:wv 1.4s ease-in-out infinite}
.wave i:nth-child(3n){background:var(--sky)}
@keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:500;white-space:nowrap}
.chip.sky{background:var(--sky-soft);color:var(--sky-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.line{background:transparent;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.live-line{font-size:14px;line-height:1.6}
.live-line mark{background:var(--sky-soft);color:var(--sky-ink);border-radius:4px;padding:0 3px}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bar-row{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.track{height:7px;border-radius:9px;background:var(--soft-2);overflow:hidden}
.track>b{display:block;height:100%;border-radius:9px;background:var(--blue)}
.track>b.hi{background:var(--good)}.track>b.lo{background:var(--bad)}.track>b.mid{background:var(--sky)}
.section{padding-block:104px}
.section-head{max-width:660px;margin-bottom:48px}
.section-head h2{font-size:clamp(30px,4vw,46px);font-weight:700;letter-spacing:-.03em;margin-top:10px}
.section-head p{color:var(--muted);font-size:17px;margin-top:14px}
.mode-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.mode-card{min-width:0}
.mode-card img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--soft-2)}
.mode-card h3{font-size:20px;font-weight:700;margin-top:18px}
.mode-card p{color:var(--muted);font-size:14px;margin-top:6px}
.mode-card .who{font-size:13px;color:var(--blue);font-weight:600;margin-top:10px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 32px}
.feat h3{font-size:18px;font-weight:700;margin-top:18px}
.feat p{color:var(--muted);margin-top:8px;font-size:15px}
.feat-ic{width:44px;height:44px;border-radius:12px;background:var(--sky-soft);display:grid;place-items:center;color:var(--blue);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.step{border-top:2px solid var(--fg);padding-top:20px}
.step .n{font-size:13px;font-weight:700;color:var(--blue)}
.step h3{font-size:22px;margin-top:10px;font-weight:700}
.step p{color:var(--muted);margin-top:8px}
.band{background:var(--soft)}
.final{background:var(--blue);color:var(--on-blue);border-radius:24px;padding:clamp(32px,6vw,72px);display:flex;flex-wrap:wrap;gap:24px;align-items:end;justify-content:space-between}
.final h2{font-size:clamp(30px,4.2vw,50px);font-weight:700;letter-spacing:-.035em;max-width:18ch}
.final .btn{background:var(--on-blue);color:var(--blue)}
.footer{padding-block:48px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.footer a{color:var(--muted)}

/* ---------- Premium features ---------- */
.pro-chip{background:var(--blue);color:var(--on-blue);font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 9px}
.tl{position:relative;height:44px;margin-top:16px}
.tl-track{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:6px;background:var(--soft-2)}
.tl-m{position:absolute;top:6px;width:24px;height:32px;margin-left:-12px;border:none;background:none;cursor:pointer;padding:0}
.tl-m i{display:block;width:14px;height:14px;border-radius:50%;margin:9px auto;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.tl-m:hover i,.tl-m:focus-visible i{transform:scale(1.35)}
.tl-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;margin-top:14px}
.tl-item{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:10px;align-items:center;padding:8px 6px;border-radius:8px;font-size:14px;background:none;border:none;text-align:left;cursor:pointer;width:100%}
.tl-item:hover{background:var(--soft)}
.tl-item .dot{width:10px;height:10px;border-radius:50%}
.switch{position:relative;width:44px;height:26px;border-radius:99px;background:var(--soft-2);border:none;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--blue)}.switch.on::after{transform:translateX(18px)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;font-size:14px;margin-top:14px;align-items:center}
.kv span:nth-child(odd){color:var(--muted)}
details.faq{border-top:1px solid var(--line);padding:16px 0}
details.faq:last-child{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;font-weight:600;list-style-position:outside}
details.faq p{color:var(--muted);font-size:14px;margin-top:8px;max-width:70ch}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.week{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.week.now{border-color:var(--blue);background:var(--sky-soft)}
.week h4{font-size:14px;font-weight:700}
.week .wk{font-size:12px;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;background:none;border:none;text-align:left;width:100%;font-size:13px}
.check .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;color:var(--on-blue);margin-top:1px}
.check.done .box{background:var(--good);border-color:var(--good)}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.qa-ans{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.qa-ans textarea{min-height:84px}
.fb{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.unlock{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.unlock li{display:flex;gap:10px;align-items:flex-start}
.unlock li svg{color:var(--good);flex:none;margin-top:2px}
@media (max-width:960px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.tl-list{grid-template-columns:1fr}}
@media (max-width:480px){.weeks{grid-template-columns:1fr}}

.demo-sw{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;background:var(--fg);color:var(--bg);border-radius:999px;padding:4px;box-shadow:var(--shadow);font-size:13px}
.demo-sw span{padding:0 8px 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.demo-sw button{border:none;background:none;color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.demo-sw button.on{background:var(--bg);color:var(--fg)}
.demo-sw button[data-plan="premium"].on{background:var(--blue);color:var(--on-blue)}

.pain-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.section-head p.lead-strong{color:var(--blue);font-weight:600;font-size:18px}
.pain-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pain-ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--fg);display:grid;place-items:center;margin-bottom:6px}
.pain-card h3{font-size:20px;font-weight:700}
.pain-card p{color:var(--muted);font-size:15px;flex:1}
.pain-fix{margin-top:8px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.pain-fix b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
@media (max-width:960px){.pain-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.pain-grid{grid-template-columns:1fr}}

/* ---------- Onboarding / Auth ---------- */
.flow{min-height:100vh;display:flex;flex-direction:column}
.flow-top{display:flex;align-items:center;justify-content:space-between;height:68px}
.flow-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-block:40px 80px}
.flow-card{width:100%;max-width:720px}
.flow-card.narrow{max-width:440px}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:28px;height:4px;border-radius:4px;background:var(--line)}
.progress-dots i.on{background:var(--blue)}
.flow h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.04em}
.flow .lead{font-size:17px;color:var(--muted);margin-top:14px;max-width:52ch}
.intro-list{display:grid;gap:0;margin-top:36px;border-top:1px solid var(--line)}
.intro-list>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line);animation:rise .5s both}
.intro-list>div:nth-child(2){animation-delay:.08s}.intro-list>div:nth-child(3){animation-delay:.16s}.intro-list>div:nth-child(4){animation-delay:.24s}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.intro-list h3{font-size:17px;font-weight:700}
.intro-list p{color:var(--muted);font-size:14px;margin-top:4px}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:32px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--blue-2)}
.choice.on{border-color:var(--blue);background:var(--soft)}
.choice h3{font-size:17px;font-weight:700}
.choice p{font-size:14px;color:var(--muted)}
.choice .who{font-size:12px;font-weight:600;color:var(--blue-2)}
.flow-actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:36px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--blue-2)}
textarea.input{resize:vertical;min-height:110px;line-height:1.55}
.form{display:flex;flex-direction:column;gap:16px;margin-top:28px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.google{background:var(--surface);border:1.5px solid var(--line);width:100%}
.google:hover{border-color:var(--blue-2)}
.err{color:var(--bad);font-size:13px}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:none;background:none;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;background:var(--bg)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.side nav button:hover{background:var(--soft);color:var(--fg)}
.side nav button.on{background:var(--soft);color:var(--fg);font-weight:600}
.side nav svg{flex:none}
.side .plan-box{margin-top:auto;background:var(--soft);border-radius:var(--r);padding:16px;font-size:13px}
.side .plan-box b{display:block;font-size:14px}
.main{min-width:0;padding:36px clamp(16px,4vw,48px) 80px}
.main-inner{max-width:1040px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.page-head h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.035em}
.page-head p{color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h3{font-size:16px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}.g-2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:1.6fr 1fr}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.stat .d{font-size:12px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--bad)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.row:hover .row-t{color:var(--blue-2)}
.row-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-m{font-size:12px;color:var(--muted)}
.score-pill{min-width:48px;text-align:center;padding:4px 10px;border-radius:999px;font-weight:700;font-size:14px}
.s-hi{background:var(--good-soft);color:var(--good)}.s-mid{background:var(--sky-soft);color:var(--sky-ink)}.s-lo{background:var(--bad-soft);color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

.setup{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}

.persona{display:flex;gap:12px;align-items:center}

.drop:hover{border-color:var(--blue-2)}
.sec-t{font-size:14px;font-weight:700;margin-bottom:10px}

.rec{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}

canvas.wv{width:100%;height:110px;display:block}

.demo-note{font-size:12px;color:var(--muted)}

function lineChart(data,{h=200,min=40,max=100,ticks=[40,60,80,100],series2=null}={}){
  const W=640,H=h,pl=34,pr=18,pt=16,pb=28;
  const n=data.length, x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)), y=v=>pt+(max-v)*(H-pt-pb)/(max-min);
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[n-1][0]} ${y(min)} L${pts[0][0]} ${y(min)} Z`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ điểm qua các lần luyện">`;
  ticks.forEach(t=>{s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`});
  s+=`<path class="ar" d="${area}"/>`;
  if(series2){const p2=series2.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');s+=`<path class="ln2" d="${p2}"/>`}
  s+=`<path class="ln" d="${path}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="dt ${i===n-1?'last':''}" cx="${p[0]}" cy="${p[1]}" r="${i===n-1?6:4}"/>`;s+=`<text x="${p[0]}" y="${H-8}" text-anchor="middle">${esc(data[i].label)}</text>`});
  const lp=pts[n-1];s+=`<text class="lbl-v" x="${lp[0]}" y="${lp[1]-12}" text-anchor="middle">${data[n-1].v}</text>`;
  return s+'</svg>';
}
function paceChart(vals){
  const W=640,H=200,pl=34,pr=10,pt=14,pb=28,max=200;
  const y=v=>pt+(max-v)*(H-pt-pb)/max, bw=(W-pl-pr)/vals.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tốc độ nói theo từng phút">`;
  s+=`<rect class="band-ok" x="${pl}" y="${y(150)}" width="${W-pl-pr}" height="${y(120)-y(150)}"/>`;
  [0,50,100,150,200].forEach(t=>{s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.22,w=bw*.56;s+=`<rect class="bar ${v>150?'over':''}" x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="4"/><text class="lbl-v" x="${x+w/2}" y="${y(v)-6}" text-anchor="middle">${v}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">Phút ${i+1}</text>`});
  return s+'</svg>';
}
function ring(v,size=150){const sw=Math.max(5,Math.round(size/12)),r=size/2-sw/2-1,c=2*Math.PI*r,small=size<100;return `<div class="ring" style="width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft-2)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sky)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}"/></svg><div class="rv"><div><b class="num" style="font-size:${Math.round(size*(small?.32:.29))}px">${v}</b>${small?'':'<br><span>/ 100</span>'}</div></div></div>`}

/* ================= App shell ================= */
const NAV=[['dashboard','Tổng quan','home'],['setup','Luyện tập','mic'],['history','Tiến bộ','chart'],['pricing','Gói dịch vụ','card'],['account','Tài khoản','user']];
function shell(view,inner){
  if(!S.user) return `<div class="wrap gbar">${logo()}<div style="display:flex;gap:8px"><button class="btn-text" data-act="login">Đăng nhập</button><button class="btn btn-primary btn-sm" data-act="start">Get started</button></div></div><div class="main"><div class="main-inner">${inner}</div></div>`;
  const p=plan();
  return `<div class="shell"><aside class="side">${logo()}<nav>${NAV.map(([k,l,i])=>`<button class="${view===k||(k==='setup'&&['record','analyzing'].includes(view))||(k==='history'&&view==='report')?'on':''}" data-go="${k}">${ic(i,18)}<span class="nl">${l}</span></button>`).join('')}</nav>
    <div class="plan-box"><b>Gói ${p.name}</b><span class="muted">Còn ${left()} / ${p.limit} lượt tháng này</span><div class="meter"><b style="width:${100-left()/p.limit*100}%"></b></div>${S.plan==='free'?`<button class="btn btn-sky btn-sm" style="margin-top:12px;width:100%" data-go="pricing">Nâng cấp Premium</button>`:''}</div>
  </aside><main class="main"><div class="main-inner">${inner}</div></main></div>${demoSwitch()}`;
}

/* ================= Dashboard ================= */
function vDashboard(){
  const ss=S.sessions, last=ss[ss.length-1], prev=ss[ss.length-2], first=ss[0];
  const avg=Math.round(ss.reduce((a,s)=>a+s.score,0)/ss.length);
  const mins=Math.round(ss.reduce((a,s)=>a+s.dur,0)/60);
  const name=(S.user?.name||'bạn').split(' ').pop();
  const recent=ss.slice(-4).reverse();
  const errs=[['Từ đệm “ừm”, “à”',first.fillers,last.fillers,'lần/bài'],['Tốc độ vượt 150 từ/phút','4','1','đoạn/bài'],['Nhìn xuống ghi chú','62%','30%','thời gian']];
  return shell('dashboard',`
    <div class="page-head"><div><h1 style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">Chào ${esc(name)}.${isPro()?proChip:''}</h1><p>Điểm của bạn tăng ${last.score-first.score} điểm kể từ bài test đầu vào.</p></div><button class="btn btn-primary" data-go="setup">${ic('mic',18)} Bắt đầu luyện</button></div>
    ${S.plan==='free'&&left()<=1?`<div class="banner" style="margin-bottom:16px"><div><h3>Còn ${left()} lượt phân tích trong tháng</h3><p>Premium có 50 lượt mỗi tháng, phân tích video và khán giả AI.</p></div><button class="btn btn-primary btn-sm" data-go="pricing">Xem gói Premium</button></div>`:''}
    <div class="grid g-4">
      <div class="card stat"><div class="k">Điểm gần nhất</div><div class="v num">${last.score}</div><div class="d ${last.score>=prev.score?'up':'down'}">${last.score>=prev.score?'+':''}${last.score-prev.score} so với lần trước</div></div>
      <div class="card stat"><div class="k">Điểm trung bình</div><div class="v num">${avg}</div><div class="d muted">${ss.length} lần luyện</div></div>
      <div class="card stat"><div class="k">Thời gian đã nói</div><div class="v num">${mins} <span style="font-size:16px">phút</span></div><div class="d muted">từ 7/9/2026</div></div>
      <div class="card stat"><div class="k">Lượt phân tích còn lại</div><div class="v num">${left()}<span style="font-size:16px" class="muted"> / ${plan().limit}</span></div><div class="meter"><b style="width:${100-left()/plan().limit*100}%"></b></div></div>
    </div>
    <div class="grid g-main" style="margin-top:16px">
      <div class="card"><h3>Điểm tổng qua các lần luyện</h3><div class="sub">Thang 100 · chấm theo 7 tiêu chí</div><div style="margin-top:12px">${lineChart(ss.map(s=>({label:fmtD(s.date),v:s.score})))}</div></div>
      <div class="card"><h3>Lỗi thường gặp</h3><div class="sub">Bài test đầu vào → bài gần nhất</div>
        <div class="list" style="margin-top:10px">${errs.map(e=>`<div style="padding:12px 0;border-top:1px solid var(--line)"><div style="font-weight:600;font-size:14px">${e[0]}</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px" class="num"><span class="chip bad">${e[1]}</span>→<span class="chip good">${e[2]}</span><span class="muted" style="font-size:12px">${e[3]}</span></div></div>`).join('')}</div>
      </div>
    </div>
    <div class="grid g-main" style="margin-top:16px">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Lần luyện gần đây</h3><button class="btn-text" data-go="history">Xem tất cả</button></div>
        <div class="list" style="margin-top:6px">${recent.map(rowHtml).join('')}</div></div>
      <div class="card" style="background:var(--soft);border-color:var(--soft)"><div class="eyebrow">Gợi ý buổi tiếp theo</div><h3 style="font-size:19px;margin-top:8px">Luyện mở bài trong 30 giây</h3><p class="muted" style="font-size:14px;margin-top:6px">Mở bài là phần bạn dùng nhiều từ đệm nhất. Thử 3 cách mở: câu hỏi, con số, câu chuyện.</p><button class="btn btn-primary btn-sm" style="margin-top:16px" data-act="suggest">Luyện ngay</button></div>
    </div>`);
}
function rowHtml(s){return `<button class="row" data-open="${s.id}"><div style="min-width:0"><div class="row-t">${esc(s.title)}</div><div class="row-m">${MODES[s.mode].name} · ${s.lang==='vi'?'Tiếng Việt':'Tiếng Anh'} · ${s.input==='video'?'Video':'Âm thanh'} · ${fmtT(s.dur)}</div></div><span class="row-m row-d num">${fmtD(s.date)}</span><span class="score-pill num ${sCls(s.score)}">${s.score}</span></button>`}

/* ================= Recording ================= */
function vRecord(){
  const d=S.draft, m=MODES[d.mode], p=plan(), r=S.rec;
  const max=d.placement?60:p.maxMin*60;
  return shell('record',`
    <div class="page-head"><div><div class="eyebrow">${m.name} · ${d.lang==='vi'?'Tiếng Việt':'Tiếng Anh'}</div><h1 style="margin-top:6px">${esc(d.title||'Bài nói chưa đặt tên')}</h1></div><button class="btn btn-ghost btn-sm" data-act="rec-cancel">Huỷ</button></div>
    <div class="rec">
      <div class="rec-stage">
        ${d.input==='video'?`<div class="cam"><video id="camv" autoplay muted playsinline></video><div class="ph" id="camph">Đang mở camera…</div><span class="tag">Theo dõi ánh mắt · cử chỉ</span></div>`:''}
        <div style="display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div><div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><span class="rec-dot ${r.paused?'paused':''}" id="recdot"></span><span id="recst">${r.paused?'Tạm dừng':'Đang ghi'}</span></div><div class="timer num" id="timer">${fmtT(r.t)}</div><div class="muted num" style="font-size:13px">Giới hạn ${fmtT(max)}</div></div>
          <div class="rec-actions"><button class="btn btn-ghost" data-act="rec-pause" id="pausebtn">${r.paused?'Tiếp tục':'Tạm dừng'}</button><button class="btn btn-primary" data-act="rec-stop">Kết thúc & phân tích</button></div>
        </div>
        <canvas class="wv" id="wv"></canvas>
        <div class="demo-note" id="micnote">${r.real?'Đang dùng micro của bạn.':'Đang mở micro…'}</div>
        <div class="kpis"><div class="kpi"><div class="k">Tốc độ</div><div class="v num" id="k-wpm">–</div><div class="k">từ/phút</div></div><div class="kpi"><div class="k">Từ đệm</div><div class="v num" id="k-fill">0</div><div class="k">lần</div></div><div class="kpi"><div class="k">Ngắt nghỉ</div><div class="v num" id="k-pause">0</div><div class="k">lần &gt; 2 giây</div></div></div>

        ${p.live?'':`<div class="lock-over"><b>Có trong gói Premium</b><p class="muted" style="font-size:13px">AI nhắc bạn ngay khi nói quá nhanh, dùng từ đệm, và đặt câu hỏi phản biện.</p><button class="btn btn-sky btn-sm" data-act="rec-upgrade">Xem gói Premium</button></div>`}

const tipHtml=t=>`<div class="tip ${t.q?'q':''}"><small>${t.at} · ${t.q?'CÂU HỎI TỪ KHÁN GIẢ':'GỢI Ý'}</small>${esc(t.text)}</div>`;

const LIVE_TIPS=[
  [6,'Mở bài tốt. Thử nhìn thẳng vào camera ở câu tiếp theo.'],
  [12,'Bạn vừa nói “ừm” 2 lần liên tiếp. Dừng im lặng 1 giây sẽ tốt hơn.'],
  [20,'Q'],

  [48,'Q'],
  [58,'Bạn sắp hết thời gian dự kiến. Chuẩn bị kết bài.'],
];
function startRec(){
  const d=S.draft;
  S.rec={t:0,paused:false,tips:[],real:false,stream:null,analyser:null,ctx:null,wpm:0,fill:0,pause:0,qi:0,timer:null,raf:null};
  go('record');
  const r=S.rec;
  const constraints=d.input==='video'?{audio:true,video:true}:{audio:true};
  if(navigator.mediaDevices?.getUserMedia){
    navigator.mediaDevices.getUserMedia(constraints).then(stream=>{
      if(S.rec!==r){stream.getTracks().forEach(t=>t.stop());return}
      r.stream=stream;r.real=true;
      try{r.ctx=new (window.AudioContext||window.webkitAudioContext)();const src=r.ctx.createMediaStreamSource(stream);r.analyser=r.ctx.createAnalyser();r.analyser.fftSize=256;src.connect(r.analyser)}catch(e){}
      const v=$('#camv');if(v&&stream.getVideoTracks().length){v.srcObject=stream;$('#camph').hidden=true}
      const n=$('#micnote');if(n)n.textContent='Đang dùng micro của bạn.';
    }).catch(()=>demoFallback(r));
  } else demoFallback(r);
  r.timer=setInterval(()=>tick(r),1000);
  drawWave(r);
}
function demoFallback(r){
  if(S.rec!==r)return;
  const n=$('#micnote');if(n)n.textContent='Không truy cập được micro, đang chạy chế độ demo với dữ liệu mô phỏng.';
  const ph=$('#camph');if(ph)ph.textContent='Không mở được camera. Chế độ demo: phân tích ngôn ngữ cơ thể dùng dữ liệu mẫu.';
}
function tick(r){
  if(S.rec!==r||r.paused)return;
  r.t++;
  const max=S.draft.placement?60:plan().maxMin*60;
  const el=$('#timer');if(el)el.textContent=fmtT(r.t);
  if(r.t>3){r.wpm=Math.round(132+Math.sin(r.t/6)*22+Math.random()*8);const w=$('#k-wpm');if(w)w.textContent=r.wpm}
  if(Math.random()<.12){r.fill++;const f=$('#k-fill');if(f)f.textContent=r.fill}
  if(r.t%17===0){r.pause++;const f=$('#k-pause');if(f)f.textContent=r.pause}
  if(plan().live){
    const loop=r.t%64, hit=LIVE_TIPS.find(x=>x[0]===loop);
    if(hit){
      const m=MODES[S.draft.mode];
      const tip=hit[1]==='Q'?{q:true,at:fmtT(r.t),text:`${m.persona}: “${m.questions[r.qi++%m.questions.length]}”`}:{at:fmtT(r.t),text:hit[1]};
      r.tips.unshift(tip);
      const live=$('#live');if(live){if(r.tips.length===1)live.innerHTML='';live.insertAdjacentHTML('afterbegin',tipHtml(tip))}
    }
  }
  if(r.t>=max){toast('Đã đạt giới hạn thời gian của gói');stopRec(true)}
}
function drawWave(r){
  const cv=$('#wv');if(!cv||S.rec!==r)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const col1=cs.getPropertyValue('--blue-2').trim(),col2=cs.getPropertyValue('--sky').trim();
  const bars=Math.floor(W/7);let data=null;
  if(r.analyser){data=new Uint8Array(r.analyser.frequencyBinCount);r.analyser.getByteFrequencyData(data)}
  const now=performance.now()/1000;
  for(let i=0;i<bars;i++){
    let v;
    if(r.paused)v=.04;
    else if(data)v=(data[Math.floor(i/bars*data.length*.7)]||0)/255;
    else v=.15+.55*Math.abs(Math.sin(i*.35+now*3)*Math.sin(i*.13-now*1.7))+Math.random()*.08;
    const h=Math.max(3,v*H*.9);
    c.fillStyle=i%4===0?col2:col1;
    c.beginPath();c.roundRect?c.roundRect(i*7,(H-h)/2,4,h,2):c.rect(i*7,(H-h)/2,4,h);c.fill();
  }
  r.raf=requestAnimationFrame(()=>drawWave(r));
}
function cleanupRec(){
  const r=S.rec;if(!r)return;
  clearInterval(r.timer);cancelAnimationFrame(r.raf);
  r.stream?.getTracks().forEach(t=>t.stop());
  try{r.ctx?.close()}catch(e){}
  S.rec=null;
}
function stopRec(){const r=S.rec;const dur=Math.max(r?r.t:0,8);cleanupRec();startAnalysis(dur)}

const AN_STEPS=['Tải bài nói lên máy chủ','Chuyển giọng nói thành văn bản','Phân tích nội dung và cấu trúc','Đo tốc độ nói và ngắt nghỉ','Phát hiện từ đệm và độ trôi chảy','Phân tích ngôn ngữ cơ thể','Viết báo cáo và gợi ý cải thiện'];

    S.an.i++;

function finishAnalysis(){
  const d=S.draft, base=S.sessions[S.sessions.length-1];
  const bump=v=>v==null?null:Math.min(95,Math.max(40,v+Math.round(Math.random()*6-2)));
  const c={};Object.keys(CRIT).forEach(k=>c[k]=k==='body'&&d.input==='audio'?null:bump(base.c[k]??66));
  const id='s'+Date.now();
  const s=mk(id,d.placement?'Giới thiệu bản thân (bài test lại)':(d.title||`${MODES[d.mode].name} ${fmtD(new Date().toISOString().slice(0,10))}`),d.mode,new Date().toISOString().slice(0,10),S.an.dur,c,Math.max(3,base.fillers-1),d.input==='upload'?'audio':d.input,d.lang);
  s.placement=d.placement;
  S.sessions.push(s);
  if(!d.placement)S.used++;
  S.currentId=id;
  S.draft.placement=false;
  go('report');
  toast('Báo cáo đã sẵn sàng');
}

function gradeAnswer(text,mode){
  const words=text.trim().split(/\s+/).filter(Boolean).length, hasNum=/\d/.test(text), fill=(text.match(/(^|[\s,.])(ừm|ờ|à|kiểu như|um|uh)(?=[\s,.!?]|$)/giu)||[]).length;
  let score=60+Math.min(20,words/3)+(hasNum?10:0)-fill*4; score=Math.round(Math.max(45,Math.min(92,score)));
  const points=[];
  points.push(words<15?'• Câu trả lời còn ngắn ('+words+' từ). Người hỏi cần thêm lý do hoặc ví dụ.':'• Độ dài phù hợp ('+words+' từ), đủ để trả lời trong khoảng 30–45 giây.');
  points.push(hasNum?'• Có số liệu cụ thể, tăng độ tin cậy.':'• Chưa có con số nào. Thêm một số liệu sẽ thuyết phục hơn'+(mode==='pitching'?', nhất là với nhà đầu tư.':'.'));
  if(fill)points.push('• Có '+fill+' từ đệm trong câu trả lời. Dừng 1 giây thay vì nói “ừm”.');
  return {score,head:score>=75?'Trả lời thuyết phục':score>=60?'Ổn, có thể gọn và chắc hơn':'Chưa thuyết phục',points};
}

    <div class="meter"><b style="width:${done/all.length*100}%;background:var(--good)"></b></div>

  return gate(html,'Lộ trình luyện tập cá nhân','AI đọc toàn bộ lịch sử luyện tập và lập kế hoạch 4 tuần tập trung vào lỗi bạn hay mắc nhất.');

/* ================= History / progress ================= */

  const [a,b]=S.compare.map(id=>ss.find(s=>s.id===id));
  const opts=sel=>pool.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${fmtD(s.date)} · ${esc(s.title)}</option>`).join('');
  return shell('history',`
    <div class="page-head"><div><h1>Tiến bộ</h1><p>${ss.length} lần luyện · lưu toàn bộ báo cáo.</p></div><button class="btn btn-primary" data-go="setup">Luyện thêm</button></div>
    ${planCard()}

      <div class="card"><h3>Điểm tổng và độ trôi chảy</h3><div class="sub">Thang 100</div><div style="margin-top:10px">${lineChart(ss.map(s=>({label:fmtD(s.date),v:s.score})),{series2:ss.map(s=>s.c.fluency)})}</div><div class="legend"><span><i style="background:var(--blue-2)"></i>Điểm tổng</span><span><i style="background:var(--sky)"></i>Độ trôi chảy</span></div></div>
      <div class="card"><h3>Từ đệm mỗi bài</h3><div class="sub">Giảm ${ss[0].fillers-ss[ss.length-1].fillers} lần so với bài đầu</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:18px">${ss.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="num" style="font-size:11px;font-weight:700">${s.fillers}</span><div style="width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--${s.fillers>14?'bad':s.fillers>9?'warn':'good'});height:${s.fillers/22*100}%"></div><span class="muted num" style="font-size:10px">${fmtD(s.date)}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3>So sánh hai lần luyện</h3>${isPro()?'':'<div class="sub">Gói Free so sánh được 3 lần luyện gần nhất. <button class="btn-text" style="font-size:13px;padding:0" data-go="pricing">Premium không giới hạn</button></div>'}
      <div class="grid g-2" style="margin-top:14px"><div class="field"><label for="cmp-a">Lần A</label><select class="input" id="cmp-a" data-cmp="0">${opts(a.id)}</select></div><div class="field"><label for="cmp-b">Lần B</label><select class="input" id="cmp-b" data-cmp="1">${opts(b.id)}</select></div></div>
      <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Tiêu chí</th><th>A</th><th>B</th><th>Thay đổi</th></tr></thead><tbody>
        ${[['Điểm tổng','score'],...Object.entries(CRIT).map(([k,l])=>[l,k])].map(([l,k])=>{const va=k==='score'?a.score:a.c[k],vb=k==='score'?b.score:b.c[k];const dd=va!=null&&vb!=null?vb-va:null;return `<tr><td>${l}</td><td class="num">${va??'–'}</td><td class="num">${vb??'–'}</td><td class="num ${dd>0?'up':dd<0?'down':''}">${dd==null?'Không có video':(dd>0?'+':'')+dd}</td></tr>`}).join('')}

/* ================= Router ================= */
const VIEWS={landing:vLanding,onboard:vOnboard,auth:vAuth,placement:vPlacement,dashboard:vDashboard,setup:vSetup,record:vRecord,analyzing:vAnalyzing,report:vReport,history:vHistory,pricing:vPricing,account:vAccount};
const NEED_AUTH=['dashboard','setup','record','history','account','placement'];
function go(v){
  if(S.rec&&v!=='record')cleanupRec();
  if(v!=='analyzing')clearInterval(anTimer);
  if(NEED_AUTH.includes(v)&&!S.user){S.auth={mode:'login',err:''};v='auth'}
  S.view=v;render();window.scrollTo(0,0);
}
function render(){
  const app=$('#app');
  app.innerHTML=VIEWS[S.view]()+modalHtml();
  if(S.view==='record'&&S.rec)drawWave(S.rec);
}
function login(u){S.user=u;persist()}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-scroll],[data-ob-mode],[data-ob-lang],[data-auth],[data-d-mode],[data-d-purpose],[data-d-lang],[data-d-input],[data-open],[data-seg],[data-cycle],[data-pay]');
  if(!t)return;
  const ds=t.dataset;
  if(t.tagName==='BUTTON'&&t.type!=='submit')e.preventDefault();
  if(ds.go){S.menu=false;return go(ds.go)}
  if(ds.scroll){if(S.menu){S.menu=false;render()}return document.getElementById(ds.scroll)?.scrollIntoView({behavior:'smooth'})}
  if(ds.obMode){S.ob.mode=ds.obMode;return render()}
  if(ds.obLang){S.ob.lang=ds.obLang;return render()}
  if(ds.auth){S.auth={mode:ds.auth,err:''};return render()}
  if(ds.dMode){saveDraftFields();S.draft.mode=ds.dMode;return render()}
  if(ds.dPurpose){saveDraftFields();S.draft.purpose=ds.dPurpose;return render()}
  if(ds.dLang){saveDraftFields();S.draft.lang=ds.dLang;return render()}
  if(ds.dInput){saveDraftFields();if(ds.locked){toast('Quay video có trong gói Premium');return}S.draft.input=ds.dInput;return render()}
  if(ds.open){S.currentId=ds.open;S.qa={};return go('report')}
  if(ds.seg){const el=document.getElementById('seg-'+ds.seg);if(el){document.querySelectorAll('.seg-t.hl').forEach(x=>x.classList.remove('hl'));el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(ds.cycle){S.modal.cycle=ds.cycle;return render()}
  if(ds.pay){S.modal.pay=ds.pay;return render()}
  const a=ds.act;
  if(a==='noop')return;
  if(a==='demo-plan'){setPlan(ds.plan);return render()}
  if(a==='menu'){S.menu=!S.menu;return render()}
  S.menu=false;
  if(a==='signup'){S.auth={mode:'signup',err:''};return go('auth')}
  if(a==='lang'){toast('Hiện hỗ trợ giao diện Tiếng Việt');return}
  if(a==='start'){S.ob={step:0,mode:'presentation',lang:'vi'};return go('onboard')}
  if(a==='login'){S.auth={mode:'login',err:''};return go('auth')}
  if(a==='sample'){S.currentId='s7';return go('report')}
  if(a==='ob-next'){S.ob.step++;return render()}
  if(a==='ob-back'){S.ob.step--;return render()}
  if(a==='ob-signup'){S.auth={mode:'signup',err:''};S.draft.mode=S.ob.mode;S.draft.lang=S.ob.lang;return go(S.user?'placement':'auth')}
  if(a==='google'){login({name:'Nguyễn Lan Anh',email:'lananh.nguyen@gmail.com',goal:S.ob.mode,org:''});toast('Đã đăng nhập bằng Google');return go(S.auth.mode==='signup'?'placement':'dashboard')}
  if(a==='placement'){S.draft={...S.draft,placement:true,title:'Giới thiệu bản thân trong 60 giây',input:'audio',mode:'presentation',content:''};return startRec()}
  if(a==='begin'){
    saveDraftFields();
    if(!S.draft.placement&&left()<=0){toast('Bạn đã dùng hết lượt phân tích tháng này');return go('pricing')}
    if(S.draft.input==='upload')return startAnalysis(S.draft.file?.dur||180);
    return startRec();
  }
  if(a==='rec-pause'){const r=S.rec;r.paused=!r.paused;$('#pausebtn').textContent=r.paused?'Tiếp tục':'Tạm dừng';$('#recst').textContent=r.paused?'Tạm dừng':'Đang ghi';$('#recdot').classList.toggle('paused',r.paused);return}
  if(a==='rec-stop')return stopRec();
  if(a==='rec-cancel'){S.draft.placement=false;return go(S.user?'setup':'landing')}
  if(a==='rec-upgrade')return go('pricing');
  if(a==='suggest'){S.draft={...S.draft,title:'Luyện mở bài trong 30 giây',purpose:'Thuyết trình trên lớp',input:'audio'};return go('setup')}
  if(a==='retry'||a==='retry-video'){const s=S.sessions.find(x=>x.id===S.currentId);S.draft={...S.draft,mode:s.mode,lang:s.lang,title:s.title.replace(/ \(.*\)$/,''),input:a==='retry-video'&&plan().video?'video':'audio',placement:false};if(a==='retry-video'&&!plan().video){toast('Quay video có trong gói Premium');return go('pricing')}return go('setup')}
  if(a==='buy'){if(!S.user){S.auth={mode:'signup',err:''};return go('auth')}S.modal={cycle:'m',pay:'MoMo'};return render()}
  if(a==='modal-close'){S.modal=null;return render()}
  if(a==='pay'){const c=S.modal.cycle,d=new Date();d.setMonth(d.getMonth()+(c==='m'?1:12));const was=isPro();S.plan='premium';S.cycle=c;S.payMethod=S.modal.pay;S.autoRenew=true;S.expiry=d.toISOString().slice(0,10);S.invoices.push({id:'HD-2611-'+String(S.invoices.length+1).padStart(4,'0'),date:new Date().toISOString().slice(0,10),amount:c==='m'?149000:1290000,method:S.modal.pay});S.modal=was?null:{type:'welcome'};persist();if(was)toast('Đã chuyển sang gói năm');return render()}
  if(a==='welcome-go'){S.modal=null;S.draft={...S.draft,input:'video',placement:false};return go('setup')}
  if(a==='to-yearly'){S.modal={cycle:'y',pay:S.payMethod};return render()}
  if(a==='autorenew'){S.autoRenew=!S.autoRenew;toast(S.autoRenew?'Đã bật tự động gia hạn':'Đã tắt tự động gia hạn');return render()}
  if(a==='free-now'){S.plan='free';S.expiry=null;S.autoRenew=true;persist();toast('Đã chuyển về gói Free');return render()}
  if(a==='qa-open'){const i=ds.i;if(!isPro()){toast('Luyện trả lời khán giả AI có trong gói Premium');return go('pricing')}S.qa[i]={...(S.qa[i]||{}),open:!(S.qa[i]||{}).open};return render()}
  if(a==='qa-grade'){const i=ds.i,q=S.qa[i]||{};if(!(q.text||'').trim()){toast('Nhập câu trả lời trước khi chấm');return}const mode=(S.sessions.find(x=>x.id===S.currentId)||{}).mode;S.qa[i]={...q,state:'loading'};render();setTimeout(()=>{S.qa[i]={...S.qa[i],state:'done',fb:gradeAnswer(S.qa[i].text,mode)};if(S.view==='report')render()},1100);return}
  if(a==='plan-check'){S.planDone[ds.id]=!S.planDone[ds.id];return render()}

  if(a==='logout'){S.user=null;S.plan='free';S.used=2;try{localStorage.removeItem('ltt-user')}catch(e){}toast('Đã đăng xuất');return go('landing')}
});
function saveDraftFields(){const t=$('#d-title'),c=$('#d-content');if(t)S.draft.title=t.value;if(c)S.draft.content=c.value}
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='authForm'){
    const email=$('#f-email').value.trim(),pass=$('#f-pass').value,name=$('#f-name')?.value.trim();
    if(S.auth.mode==='signup'&&!name){S.auth.err='Nhập họ và tên để tạo tài khoản.';return render()}
    if(!/^\S+@\S+\.\S+$/.test(email)){S.auth.err='Email chưa đúng định dạng, ví dụ: ban@email.com.';return render()}
    if(pass.length<6){S.auth.err='Mật khẩu cần ít nhất 6 ký tự.';return render()}
    login({name:name||email.split('@')[0],email,goal:S.ob.mode,org:''});
    toast(S.auth.mode==='signup'?'Đã tạo tài khoản':'Đã đăng nhập');
    return go(S.auth.mode==='signup'?'placement':'dashboard');
  }
  if(e.target.id==='profileForm'){
    S.user={...S.user,name:$('#p-name').value.trim()||S.user.name,email:$('#p-email').value.trim()||S.user.email,org:$('#p-org').value.trim(),goal:$('#p-goal').value};
    persist();toast('Đã lưu thông tin');render();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='d-file'){
    const f=e.target.files[0];if(!f)return;saveDraftFields();
    S.draft.file={name:f.name,size:f.size,dur:0};render();
    const el=document.createElement(f.type.startsWith('video')?'video':'audio');el.preload='metadata';
    el.onloadedmetadata=()=>{if(S.draft.file&&isFinite(el.duration)){S.draft.file.dur=Math.round(el.duration);if(S.view==='setup')render()}URL.revokeObjectURL(el.src)};
    el.src=URL.createObjectURL(f);
  }
  if(e.target.dataset.cmp){S.compare[+e.target.dataset.cmp]=e.target.value;render()}
});
document.addEventListener('input',e=>{const i=e.target.dataset?.qaText;if(i!=null)S.qa[i]={...(S.qa[i]||{}),text:e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

render();
</script>
